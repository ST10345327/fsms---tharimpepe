<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b3a5c">
    <title>Volunteers - Tharimpepe FSMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/shared.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-safe">
        <main class="mobile-content" role="main">
            <!-- Volunteer Statistics -->
            <div class="stat-grid" aria-label="Volunteer statistics">
                <div class="stat-card" aria-label="Total active volunteers">
                    <div class="stat-value" id="stat-active-vols">—</div>
                    <div class="stat-label">Active Volunteers</div>
                </div>
                <div class="stat-card" aria-label="Volunteers scheduled today">
                    <div class="stat-value" style="color:var(--info);" id="stat-scheduled-today">—</div>
                    <div class="stat-label">Scheduled Today</div>
                </div>
                <div class="stat-card" aria-label="Total hours this week">
                    <div class="stat-value" style="color:var(--warning);" id="stat-hours-week">—</div>
                    <div class="stat-label">Hours This Week</div>
                </div>
                <div class="stat-card" aria-label="Volunteer attendance rate">
                    <div class="stat-value" style="color:var(--success);" id="stat-attendance-rate">—</div>
                    <div class="stat-label">Attendance Rate</div>
                </div>
            </div>

            <!-- Register Volunteer -->
            <div class="proto-card" aria-labelledby="reg-title">
                <h2 id="reg-title"><i class="fas fa-user-plus" style="color:var(--mobile-primary);margin-right:var(--space-sm);" aria-hidden="true"></i>Register Volunteer</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="vol-firstname">First name *</label>
                        <input type="text" id="vol-firstname" placeholder="e.g. Nomsa" required aria-label="First name">
                    </div>
                    <div class="form-group">
                        <label for="vol-lastname">Last name *</label>
                        <input type="text" id="vol-lastname" placeholder="e.g. Mahlangu" required aria-label="Last name">
                    </div>
                    <div class="form-group">
                        <label for="vol-phone">Contact number</label>
                        <input type="tel" id="vol-phone" placeholder="0XX XXX XXXX" aria-label="Contact number">
                    </div>
                    <div class="form-group">
                        <label for="vol-email">Email</label>
                        <input type="email" id="vol-email" placeholder="volunteer@email.com" aria-label="Email address">
                    </div>
                    <div class="form-group">
                        <label for="vol-role">Role</label>
                        <select id="vol-role" aria-label="Volunteer role">
                            <option value="meal_prep">Meal Preparation</option>
                            <option value="distribution">Distribution</option>
                            <option value="administration">Administration</option>
                            <option value="transport">Transport</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vol-availability">Availability</label>
                        <select id="vol-availability" aria-label="Availability">
                            <option value="weekdays">Monday - Friday</option>
                            <option value="weekends">Weekends Only</option>
                            <option value="flexible">Flexible / As Needed</option>
                            <option value="fulltime">Full Time</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vol-startdate">Start date</label>
                        <input type="date" id="vol-startdate" aria-label="Start date">
                    </div>
                    <div class="form-group">
                        <label for="vol-skills">Skills / Notes</label>
                        <textarea id="vol-skills" rows="2" placeholder="Any relevant skills or notes" aria-label="Skills or additional notes"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary btn-block" id="save-volunteer-btn" aria-label="Submit volunteer registration">Register Volunteer</button>
                </div>
            </div>

            <!-- Today's Schedule -->
            <div class="proto-card">
                <div class="section-header">
                    <h2><i class="fas fa-calendar-day" style="color:var(--mobile-primary);margin-right:var(--space-sm);"></i>Today's Schedule</h2>
                    <span class="chip" id="schedule-date-label">Today</span>
                </div>
                <div id="today-schedule-list">
                    <div class="placeholder"><i class="fas fa-spinner fa-pulse"></i><p>Loading schedule...</p></div>
                </div>
            </div>

            <!-- Weekly Schedule -->
            <div class="proto-card">
                <div class="section-header">
                    <h2><i class="fas fa-calendar-week" style="color:var(--mobile-primary);margin-right:var(--space-sm);"></i>Weekly Schedule</h2>
                </div>
                <p style="font-size:12px;color:var(--mobile-muted);margin-bottom:var(--space-sm);" id="schedule-week-label">Loading schedule...</p>
                <div class="schedule-week" id="volunteer-schedule-grid">
                    <div class="placeholder" style="grid-column:1/-1;"><i class="fas fa-spinner fa-pulse"></i><p>Loading...</p></div>
                </div>
            </div>

            <!-- Volunteer List -->
            <div class="proto-card">
                <div class="section-header">
                    <h2><i class="fas fa-users" style="color:var(--mobile-primary);margin-right:var(--space-sm);"></i>Volunteer Directory</h2>
                    <input type="text" id="search-volunteer" placeholder="Search..." class="search-input" oninput="filterVolunteers(this.value)">
                </div>
                <div id="volunteer-list">
                    <div class="placeholder"><i class="fas fa-spinner fa-pulse"></i><p>Loading volunteers...</p></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Volunteer Detail Modal -->
    <div class="modal-overlay" id="volunteer-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Volunteer Details</div>
                <button class="modal-close" onclick="closeVolunteerModal()" aria-label="Close modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="volunteer-modal-content"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeVolunteerModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="assets/runtime-config.js"></script>
    <script src="assets/server-discovery.js"></script>
    <script src="assets/api.js"></script>
    <script src="assets/notifications.js"></script>
    <script src="assets/shared.js"></script>
    <script>
        initPage('Volunteers', 'volunteers');

        let allVolunteers = [];
        let allScheduleSlots = [];

        // Set default start date
        document.getElementById('vol-startdate').valueAsDate = new Date();

        // Load volunteer statistics
        (async function loadVolunteerStats() {
            try {
                const statsData = await API.get('/api/volunteers/stats.php');
                if (statsData.success && statsData.data) {
                    const d = statsData.data;
                    document.getElementById('stat-active-vols').textContent = (d.active || 0).toLocaleString();
                    document.getElementById('stat-scheduled-today').textContent = (d.scheduled_today || 0).toLocaleString();
                    document.getElementById('stat-hours-week').textContent = (d.hours_week || 0).toLocaleString();
                    document.getElementById('stat-attendance-rate').textContent = (d.attendance_rate || 0) + '%';
                }
            } catch (e) {
                console.warn('Volunteer stats unavailable:', e.message);
            }
        })();

        // Load today's schedule
        (async function loadTodaySchedule() {
            const container = document.getElementById('today-schedule-list');
            try {
                const today = new Date().toISOString().split('T')[0];
                const data = await API.get(`/api/volunteers/schedule.php?date=${today}`);
                if (data.success && data.data && data.data.length > 0) {
                    container.innerHTML = data.data.map(s => `
                        <div class="sched-slot">
                            <span class="sched-time">${s.Time || s.time || '—'}</span>
                            <span class="sched-task">${s.Task || s.task || 'Scheduled'}</span>
                            <span class="badge ${(s.Status === 'Confirmed' || s.status === 'confirmed') ? 'badge-green' : (s.Status === 'Pending' || s.status === 'pending') ? 'badge-amber' : 'badge-blue'}">${s.Status || s.status || 'Scheduled'}</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-calendar-check"></i><h3>No schedule for today</h3></div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="error-state"><i class="fas fa-exclamation-circle"></i><p>Unable to load schedule</p></div>';
            }
        })();

        // Load weekly schedule
        (async function loadWeeklySchedule() {
            try {
                const schedData = await API.get('/api/volunteers/schedule.php');
                const grid = document.getElementById('volunteer-schedule-grid');
                const label = document.getElementById('schedule-week-label');
                
                if (schedData.success && schedData.week_label) {
                    label.textContent = 'Week of ' + schedData.week_label;
                }
                
                if (schedData.success && schedData.data && schedData.data.length > 0) {
                    allScheduleSlots = schedData.data;
                    // Group by day
                    const days = {};
                    schedData.data.forEach(slot => {
                        const day = slot.Day || slot.day || 'Unknown';
                        if (!days[day]) days[day] = [];
                        days[day].push(slot);
                    });

                    const dayNames = Object.keys(days);
                    grid.innerHTML = dayNames.map(day => `
                        <div class="schedule-day">
                            <div class="schedule-day-name">${day}</div>
                            ${days[day].map(slot => `
                                <div class="schedule-day-slot">
                                    <span class="time">${slot.Time || slot.time}</span> — ${slot.VolunteerName || slot.volunteer || slot.name || 'TBD'}
                                </div>
                            `).join('')}
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-calendar"></i><h3>No weekly schedule</h3></div>';
                }
            } catch (e) {
                document.getElementById('volunteer-schedule-grid').innerHTML = '<div class="error-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-circle"></i><p>Unable to load schedule</p></div>';
            }
        })();

        // Load volunteer list
        (async function loadVolunteers() {
            const container = document.getElementById('volunteer-list');
            try {
                const data = await API.get('/api/volunteers/list.php');
                if (data.success && data.data) {
                    allVolunteers = data.data;
                    renderVolunteers(allVolunteers);
                } else {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><h3>No volunteers yet</h3></div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="error-state"><i class="fas fa-exclamation-circle"></i><p>Unable to load volunteers</p></div>';
            }
        })();

        function renderVolunteers(list) {
            const container = document.getElementById('volunteer-list');
            if (!container || list.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><h3>No volunteers found</h3></div>';
                return;
            }

            container.innerHTML = list.map(v => `
                <div class="sched-slot" style="cursor:pointer;" onclick="showVolunteerDetail('${v.VolunteerID || v.id}')">
                    <div style="display:flex;align-items:center;gap:10px;flex:1;">
                        <div class="skeleton-avatar" style="background:${getAvatarColor((v.FirstName || v.first_name || '') + ' ' + (v.LastName || v.last_name || ''))};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;">
                            ${getInitials((v.FirstName || v.first_name || '') + ' ' + (v.LastName || v.last_name || ''))}
                        </div>
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:600;font-size:13px;">${v.FirstName || v.first_name || ''} ${v.LastName || v.last_name || ''}</div>
                            <div style="font-size:11px;color:var(--mobile-muted);">${v.Role || v.role || 'Volunteer'} · ${v.Phone || v.phone || 'No contact'}</div>
                        </div>
                    </div>
                    <span class="badge ${(v.Status === 'Active' || v.status === 'active') ? 'badge-green' : (v.Status === 'Inactive' || v.status === 'inactive') ? 'badge-amber' : 'badge-blue'}">${v.Status || v.status || 'Active'}</span>
                </div>
            `).join('');
        }

        function filterVolunteers(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderVolunteers(allVolunteers);
                return;
            }
            const filtered = allVolunteers.filter(v => {
                const name = ((v.FirstName || v.first_name || '') + ' ' + (v.LastName || v.last_name || '')).toLowerCase();
                const role = (v.Role || v.role || '').toLowerCase();
                return name.includes(q) || role.includes(q);
            });
            renderVolunteers(filtered);
        }

        // Save volunteer
        document.getElementById('save-volunteer-btn').addEventListener('click', async function() {
            const btn = this;
            const data = {
                first_name: document.getElementById('vol-firstname').value.trim(),
                last_name: document.getElementById('vol-lastname').value.trim(),
                phone: document.getElementById('vol-phone').value.trim(),
                email: document.getElementById('vol-email').value.trim(),
                role: document.getElementById('vol-role').value,
                availability: document.getElementById('vol-availability').value,
                start_date: document.getElementById('vol-startdate').value,
                skills: document.getElementById('vol-skills').value.trim()
            };

            if (!data.first_name || !data.last_name) {
                showToast('Please enter first and last name', 'warning');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Registering...';

            try {
                const result = await API.post('/api/volunteers/register.php', data);
                if (result.success) {
                    showToast('Volunteer registered successfully!', 'success');
                    // Clear form
                    document.getElementById('vol-firstname').value = '';
                    document.getElementById('vol-lastname').value = '';
                    document.getElementById('vol-phone').value = '';
                    document.getElementById('vol-email').value = '';
                    document.getElementById('vol-skills').value = '';
                    document.getElementById('vol-startdate').valueAsDate = new Date();
                    // Reload
                    loadVolunteers();
                    loadVolunteerStats();
                } else {
                    showToast('Failed: ' + (result.message || 'Unknown error'), 'error');
                }
            } catch (err) {
                showToast('Failed to register: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Register Volunteer';
            }
        });

        function showVolunteerDetail(id) {
            const volunteer = allVolunteers.find(v => String(v.VolunteerID || v.id) === String(id));
            if (!volunteer) {
                showToast('Volunteer details unavailable', 'error');
                return;
            }

            const firstName = volunteer.FirstName || volunteer.first_name || '';
            const lastName = volunteer.LastName || volunteer.last_name || '';
            const fullName = volunteer.FullName || `${firstName} ${lastName}`.trim();
            const content = document.getElementById('volunteer-modal-content');

            content.innerHTML = `
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                    <div class="skeleton-avatar" style="background:${getAvatarColor(fullName)};width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;">
                        ${getInitials(fullName)}
                    </div>
                    <div>
                        <div style="font-size:18px;font-weight:700;color:var(--mobile-text);">${escapeHtml(fullName)}</div>
                        <div style="color:var(--mobile-muted);font-size:13px;">${escapeHtml(volunteer.Role || volunteer.role || 'Volunteer')}</div>
                    </div>
                </div>
                <div style="display:grid;gap:12px;">
                    <div class="sched-slot"><span style="color:var(--mobile-muted);min-width:120px;">Volunteer ID</span><span style="font-weight:600;">${volunteer.VolunteerID || volunteer.id}</span></div>
                    <div class="sched-slot"><span style="color:var(--mobile-muted);min-width:120px;">Status</span><span class="badge badge-green">${escapeHtml(volunteer.Status || volunteer.status || 'Active')}</span></div>
                    <div class="sched-slot"><span style="color:var(--mobile-muted);min-width:120px;">Phone</span><span>${escapeHtml(volunteer.Phone || volunteer.phone || '—')}</span></div>
                    <div class="sched-slot"><span style="color:var(--mobile-muted);min-width:120px;">Email</span><span>${escapeHtml(volunteer.Email || volunteer.email || '—')}</span></div>
                    <div class="sched-slot"><span style="color:var(--mobile-muted);min-width:120px;">Availability</span><span>${escapeHtml(volunteer.AvailabilityStatus || volunteer.availability || '—')}</span></div>
                    <div class="sched-slot"><span style="color:var(--mobile-muted);min-width:120px;">Skills</span><span>${escapeHtml(volunteer.Skills || volunteer.skills || '—')}</span></div>
                </div>
            `;

            document.getElementById('volunteer-modal').classList.add('open');
        }

        function closeVolunteerModal() {
            document.getElementById('volunteer-modal').classList.remove('open');
        }

        document.getElementById('volunteer-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVolunteerModal();
            }
        });

        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'} toast-icon"></i>
                <div class="toast-message">${escapeHtml(message)}</div>
            `;
            
            const container = document.createElement('div');
            container.className = 'toast-container';
            container.appendChild(toast);
            document.body.appendChild(container);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => container.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
