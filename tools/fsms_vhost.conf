# Apache virtual host for FSMS (copy into C:/xampp/apache/conf/extra/httpd-vhosts.conf)
# Replace the paths if you move the project to a different folder.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName fsms.local
    DocumentRoot "C:/Users/CASH/Desktop/fsms - tharimpepe/public"
    <Directory "C:/Users/CASH/Desktop/fsms - tharimpepe/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/fsms.local-error.log"
    CustomLog "logs/fsms.local-access.log" common
</VirtualHost>
