<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1D9E75">
    <title>Stock & Donations - Tharimpepe FSMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/shared.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-safe">
        <main class="mobile-content">
            <!-- KPI Summary -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Total Stock Items</div>
                        <div class="kpi-value" data-kpi="total_items">—</div>
                        <div class="kpi-meta" data-kpi="items_meta">Loading...</div>
                    </div>
                    <span class="kpi-icon green"><i class="fas fa-box" aria-hidden="true"></i></span>
                </div>
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Low Stock Items</div>
                        <div class="kpi-value" data-kpi="low_stock_count">—</div>
                        <div class="kpi-meta" data-kpi="low_stock_meta">Loading...</div>
                    </div>
                    <span class="kpi-icon orange"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i></span>
                </div>
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Donations This Month</div>
                        <div class="kpi-value" data-kpi="monthly_donations">—</div>
                        <div class="kpi-meta" data-kpi="donations_meta">Loading...</div>
                    </div>
                    <span class="kpi-icon purple"><i class="fas fa-hand-holding-heart" aria-hidden="true"></i></span>
                </div>
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Stock Value</div>
                        <div class="kpi-value" data-kpi="stock_value">—</div>
                        <div class="kpi-meta" data-kpi="value_meta">Estimated</div>
                    </div>
                    <span class="kpi-icon blue"><i class="fas fa-coins" aria-hidden="true"></i></span>
                </div>
            </div>

            <!-- Current Stock -->
            <div class="proto-card">
                <h2><i class="fas fa-boxes-stacked" style="color:var(--mobile-primary);margin-right:8px;"></i>Current Stock Levels</h2>
                <div id="stock-list">
                    <div class="placeholder"><i class="fas fa-spinner fa-pulse"></i><p>Loading stock data...</p></div>
                </div>
                <div style="margin-top:14px;">
                    <button class="btn btn-primary btn-block" onclick="alert('Stock update form coming soon')">Update Stock</button>
                </div>
            </div>

            <!-- Recent Donations -->
            <div class="proto-card">
                <h2><i class="fas fa-hand-holding-heart" style="color:var(--mobile-primary);margin-right:8px;"></i>Recent Donations</h2>
                <div id="donation-log">
                    <div class="placeholder"><i class="fas fa-spinner fa-pulse"></i><p>Loading donations...</p></div>
                </div>
            </div>

            <!-- Add Donation -->
            <div class="proto-card">
                <h2><i class="fas fa-plus-circle" style="color:var(--mobile-primary);margin-right:8px;"></i>Record Donation</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Donor name</label>
                        <input type="text" id="donor-name" placeholder="e.g. Shoprite Checkers">
                    </div>
                    <div class="form-group">
                        <label>Item</label>
                        <input type="text" id="donation-item" placeholder="e.g. Maize meal">
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="donation-qty" placeholder="e.g. 50">
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <input type="text" id="donation-unit" placeholder="e.g. kg, L, units">
                    </div>
                </div>
                <div style="margin-top:14px;">
                    <button class="btn btn-primary btn-block" id="record-donation-btn">Record Donation</button>
                </div>
            </div>
        </main>

        <nav class="mobile-bottom-nav" role="navigation" aria-label="Primary">
            <a class="mobile-nav-item" href="dashboard.html"><i class="fas fa-house" aria-hidden="true"></i><span>Home</span></a>
            <a class="mobile-nav-item" href="beneficiaries.html"><i class="fas fa-users" aria-hidden="true"></i><span>Beneficiaries</span></a>
            <a class="mobile-nav-item" href="attendance.html"><i class="fas fa-clipboard-check" aria-hidden="true"></i><span>Attendance</span></a>
            <a class="mobile-nav-item active" href="stock.html"><i class="fas fa-boxes-stacked" aria-hidden="true"></i><span>Stock</span></a>
        </nav>
    </div>

    <script src="assets/api.js"></script>
    <script src="assets/shared.js"></script>
    <script>
        initPage('Stock & Donations', 'stock');

        (async function loadStockData() {
            try {
                // Load stock items
                const stockData = await API.get('/api/stock/list.php');
                const stockContainer = document.getElementById('stock-list');
                if (stockData.success && stockData.data && stockData.data.length > 0) {
                    stockContainer.innerHTML = stockData.data.map(item => {
                        const pct = item.StockLevel || item.stock_level || item.quantity_pct || 0;
                        const barColor = pct > 50 ? '#1D9E75' : pct > 25 ? '#F5B041' : '#dc2626';
                        const textColor = pct > 50 ? '#5DCAA5' : pct > 25 ? '#F5B041' : '#fca5a5';
                        return `
                            <div class="stock-item">
                                <div>
                                    <div class="stock-item-name">${item.ItemName || item.name || item.item_name}</div>
                                    <div class="stock-item-qty">${item.Quantity || item.quantity || '0'} ${item.Unit || item.unit || ''} remaining</div>
                                </div>
                                <div class="stock-item-pct" style="color:${textColor};">${pct}%</div>
                            </div>
                            <div class="stock-bar"><div class="stock-fill" style="width:${pct}%;background:${barColor};"></div></div>
                        `;
                    }).join('');
                }
            } catch (e) {
                document.getElementById('stock-list').innerHTML = '<div class="placeholder"><i class="fas fa-exclamation-circle"></i><p>Stock data unavailable</p></div>';
            }

            try {
                // Load donations
                const donData = await API.get('/api/donations/list.php');
                const donContainer = document.getElementById('donation-log');
                if (donData.success && donData.data && donData.data.length > 0) {
                    donContainer.innerHTML = donData.data.map(d => `
                        <div class="donation-log-item">
                            <div class="donation-log-left">
                                <div class="donation-log-item-name">${d.ItemName || d.item || d.item_name}</div>
                                <div class="donation-log-item-meta">${d.DonorName || d.donor || 'Anonymous'} · ${d.Date || d.date}</div>
                            </div>
                            <div class="donation-log-right">
                                <div class="donation-log-qty">+${d.Quantity || d.quantity} ${d.Unit || d.unit || ''}</div>
                                <div class="donation-log-source">${d.Source || d.source || 'Donation'}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                document.getElementById('donation-log').innerHTML = '<div class="placeholder"><i class="fas fa-exclamation-circle"></i><p>Donations data unavailable</p></div>';
            }

            // Record donation button
            document.getElementById('record-donation-btn').addEventListener('click', async function() {
                const donor = document.getElementById('donor-name').value.trim();
                const item = document.getElementById('donation-item').value.trim();
                const qty = document.getElementById('donation-qty').value;
                const unit = document.getElementById('donation-unit').value.trim();

                if (!item || !qty) {
                    alert('Please fill in item and quantity');
                    return;
                }

                try {
                    const result = await API.post('/api/donations/record.php', {
                        donor_name: donor,
                        item_name: item,
                        quantity: parseFloat(qty),
                        unit: unit
                    });
                    if (result.success) {
                        alert('Donation recorded!');
                        location.reload();
                    }
                } catch (err) {
                    alert('Failed to record: ' + err.message);
                }
            });
        })();
    </script>
</body>
</html>
