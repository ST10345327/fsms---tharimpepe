<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b3a5c">
    <title>Login - Tharimpepe FSMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1b3a5c;
            --primary-hover: #2e4a6c;
            --accent: #1d9e75;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text: #1a1d23;
            --muted: #6b7280;
            --border: #e2e5ea;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-img {
            width: 80px;
            height: auto;
            margin-bottom: 16px;
        }
        .brand-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
            letter-spacing: -0.025em;
        }
        .brand-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin: 4px 0 0;
        }
        .login-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 40px 32px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .card-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            color: #1e293b;
        }
        .card-header p {
            font-size: 14px;
            color: var(--muted);
            margin: 8px 0 0;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--muted);
            font-size: 16px;
        }
        input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            font-size: 15px;
            transition: all 0.2s;
        }
        input::placeholder { color: #94a3b8; }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.12);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }

        .forgot-password {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password:hover {
            color: var(--primary);
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
            text-align: center;
        }
        .footer-text {
            text-align: center;
            margin-top: 48px;
            font-size: 13px;
            color: var(--muted);
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Optional space for logo as requested -->
        <div class="logo-section">
            <img src="assets/tharimpepe-logo.png" alt="Tharimpepe Logo" class="logo-img" onerror="this.style.display='none'">
            <h1 class="brand-name">Tharimpepe Feeding Scheme</h1>
            <p class="brand-subtitle">Feeding Scheme Management System</p>
        </div>

        <div class="login-card">
            <div class="card-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access the admin portal</p>
            </div>

            <div id="error-msg" class="error"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" id="login-btn">Login</button>
            </form>

            <a href="#" class="forgot-password" onclick="alert('Please contact your administrator to reset your password.')">Forgot password?</a>
        </div>

        <div class="footer-text">© 2026 Tharimpepe Feeding Scheme. All rights reserved.</div>
    </div>

    <script src="assets/runtime-config.js"></script>
    <script src="assets/api.js"></script>
    <script src="assets/server-discovery.js"></script>
    <script>
        // Auto-discover backend on startup
        (async function autoDiscover() {
            try {
                const current = RuntimeConfig.getAPIBase();
                const server = await discoverServerFast(current);
                if (server) {
                    RuntimeConfig.setAPIBase(server);
                    if (typeof API !== 'undefined' && API.setBaseURL) {
                        API.setBaseURL(server);
                    }
                    console.log('[Discovery] Server found:', server);
                } else {
                    console.warn('[Discovery] No server found on local network');
                }
            } catch (e) {
                console.warn('[Discovery] Scan error:', e);
            }
        })();
        
        // Check for existing valid session
        (async function checkSession() {
            if (typeof API !== 'undefined' && API.isAuthenticated()) {
                try {
                    const user = await API.validateToken();
                    if (user) {
                        window.location.href = './dashboard.html';
                        return;
                    }
                } catch {
                    if (typeof API !== 'undefined') {
                        API.clearAuth();
                    }
                }
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const error = document.getElementById('error-msg');
            const btn = document.getElementById('login-btn');

            error.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                await API.login(username, password);
                window.location.href = './dashboard.html';
            } catch (err) {
                error.style.display = 'block';
                error.textContent = err.message || 'Invalid username or password';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
