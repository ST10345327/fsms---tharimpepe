<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b3a5c">
    <title>Users - Tharimpepe FSMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/shared.css" rel="stylesheet">
    <style>
        :root {
            --primary: var(--fsms-navy);
            --primary-hover: var(--fsms-navy-2);
        }
        .audit-page .stat .value { color: var(--mobile-text); }
    </style>
</head>
<body>
    <div class="mobile-safe audit-page">
        <main class="mobile-content" role="main">
    <div class="mobile-page-header">
        <h1><i class="fa-solid fa-shield-halved"></i> Audit Logs</h1>
        <p>User activity and system events</p>
    </div>

    <div class="stat-grid" id="stats">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value" id="stat-total">-</div></div>
        <div class="stat-card"><div class="stat-label">Errors (24h)</div><div class="stat-value" id="stat-errors">-</div></div>
        <div class="stat-card"><div class="stat-label">Active users</div><div class="stat-value" id="stat-users">-</div></div>
    </div>

    <div class="proto-card">
        <div class="toolbar" style="display:flex;flex-direction:column;gap:12px;margin-bottom:10px;">
            <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;">
                <select id="severity">
                    <option value="">All severities</option>
                    <option value="info">Info</option>
                    <option value="warning">Warning</option>
                    <option value="critical">Critical</option>
                    <option value="error">Error</option>
                </select>
                <select id="category">
                    <option value="">All categories</option>
                    <option value="auth">Auth</option>
                    <option value="attendance">Attendance</option>
                    <option value="stock">Stock</option>
                    <option value="donations">Donations</option>
                </select>
                <input type="text" id="search" placeholder="Search username or action" style="min-width: 220px;">
            </div>
            <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="loadLogs()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn btn-secondary" onclick="exportLogs()"><i class="fa-solid fa-download"></i> Export</button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Actor</th>
                        <th>Category</th>
                        <th>Action</th>
                        <th>Severity</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logs-body">
                    <tr><td colspan="6" class="empty">Loading audit logs...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
        </main>
    </div>

    <script src="assets/runtime-config.js"></script>
    <script src="assets/server-discovery.js"></script>
    <script src="assets/api.js"></script>
    <script src="assets/shared.js"></script>
    <script>
        initPage('Users', 'users');
        async function loadStats() {
            try {
                const data = await API.get('/api/audit/stats.php');
                if (data && data.success && data.data) {
                    document.getElementById('stat-total').textContent = data.data.total ?? '-';
                    document.getElementById('stat-errors').textContent = data.data.recent_failures_24h ?? '-';
                    document.getElementById('stat-users').textContent = data.data.active_users_today ?? '-';
                }
            } catch (e) {
                console.warn('Stats load failed', e);
            }
        }

        async function loadLogs() {
            const severity = document.getElementById('severity').value;
            const category = document.getElementById('category').value;
            const search = document.getElementById('search').value.trim();
            const tbody = document.getElementById('logs-body');
            tbody.innerHTML = '<tr><td colspan="6" class="empty">Loading...</td></tr>';

            const params = new URLSearchParams();
            params.set('limit', '100');
            if (severity) params.set('severity', severity);
            if (category) params.set('action_category', category);
            if (search) params.set('search', search);

            try {
                const data = await API.get('/api/audit/logs.php?' + params.toString());
                if (data && data.success) {
                    renderLogs(data.data || []);
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">Failed to load logs</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">Unable to load logs</td></tr>';
            }
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('logs-body');
            if (!logs.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty">No audit logs found</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td>${formatTime(log.CreatedAt)}</td>
                    <td>${escapeHtml(log.ActorUsername || 'System')}</td>
                    <td>${escapeHtml(log.ActionCategory || '-')}</td>
                    <td>${escapeHtml(log.ActionType || '-')}</td>
                    <td><span class="badge badge-${log.Severity || 'info'}">${escapeHtml(log.Severity || 'info')}</span></td>
                    <td>${log.IsSuccess ? 'OK' : 'Failed'}</td>
                </tr>
            `).join('');
        }

        function formatTime(value) {
            if (!value) return '-';
            try {
                return new Date(value).toLocaleString();
            } catch (e) {
                return value;
            }
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '-';
            return String(text).replace(/[&<>"']/g, function(m) {
                return ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' })[m];
            });
        }

        async function exportLogs() {
            const severity = document.getElementById('severity').value;
            const category = document.getElementById('category').value;
            const params = new URLSearchParams();
            params.set('limit', '1000');
            if (severity) params.set('severity', severity);
            if (category) params.set('action_category', category);

            try {
                const data = await API.get('/api/audit/logs.php?' + params.toString());
                if (data && data.success) {
                    const blob = new Blob([JSON.stringify(data.data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'audit-logs-' + new Date().toISOString().slice(0, 10) + '.json';
                    a.click();
                    URL.revokeObjectURL(url);
                }
            } catch (e) {
                alert('Export failed');
            }
        }

        document.getElementById('severity').addEventListener('change', loadLogs);
        document.getElementById('category').addEventListener('change', loadLogs);
        document.getElementById('search').addEventListener('input', loadLogs);

        loadStats();
        loadLogs();
    </script>
</body>
</html>
