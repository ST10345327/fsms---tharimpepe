<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1D9E75">
    <title>Attendance - Tharimpepe FSMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/shared.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-safe">
        <main class="mobile-content">
            <!-- KPI Summary -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Today's Attendance</div>
                        <div class="kpi-value" data-kpi="todays_attendance">—</div>
                        <div class="kpi-meta" data-kpi="attendance_meta">Loading...</div>
                    </div>
                    <span class="kpi-icon green"><i class="fas fa-clipboard-check" aria-hidden="true"></i></span>
                </div>
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Attendance Rate</div>
                        <div class="kpi-value" data-kpi="attendance_rate">—</div>
                        <div class="kpi-meta" data-kpi="rate_meta">Loading...</div>
                    </div>
                    <span class="kpi-icon blue"><i class="fas fa-chart-line" aria-hidden="true"></i></span>
                </div>
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Present</div>
                        <div class="kpi-value" data-kpi="present_count">—</div>
                        <div class="kpi-meta" data-kpi="present_meta">Marked today</div>
                    </div>
                    <span class="kpi-icon purple"><i class="fas fa-user-check" aria-hidden="true"></i></span>
                </div>
                <div class="kpi-card">
                    <div>
                        <div class="kpi-label">Absent</div>
                        <div class="kpi-value" data-kpi="absent_count">—</div>
                        <div class="kpi-meta" data-kpi="absent_meta">Not yet marked</div>
                    </div>
                    <span class="kpi-icon orange"><i class="fas fa-user-xmark" aria-hidden="true"></i></span>
                </div>
            </div>

            <!-- Mark Attendance -->
            <div class="proto-card">
                <div class="section-header">
                    <h2 style="font-size:16px;font-weight:700;color:#fff;margin:0;"><i class="fas fa-pen-to-square" style="color:var(--mobile-primary);margin-right:8px;"></i>Mark Attendance</h2>
                    <input type="date" id="attendance-date" style="max-width:150px;padding:8px 10px;border:1px solid var(--mobile-border);border-radius:8px;background:var(--mobile-bg);color:var(--mobile-text);font-size:13px;">
                </div>
                <p style="font-size:12px;color:var(--mobile-muted);margin-bottom:10px;">Tap a tile to toggle present / absent</p>
                <div class="attendance-grid" id="attendance-grid">
                    <div class="placeholder"><i class="fas fa-spinner fa-pulse"></i><p>Loading beneficiaries...</p></div>
                </div>
                <div style="margin-top:14px;">
                    <button class="btn btn-primary btn-block" id="save-attendance-btn">Save Attendance</button>
                </div>
            </div>

            <!-- Attendance History -->
            <div class="proto-card">
                <h2><i class="fas fa-history" style="color:var(--mobile-primary);margin-right:8px;"></i>Attendance History</h2>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Date</th><th>Registered</th><th>Present</th><th>%</th></tr>
                        </thead>
                        <tbody id="attendance-history-body">
                            <tr><td colspan="4" style="text-align:center;color:var(--mobile-muted);">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <nav class="mobile-bottom-nav" role="navigation" aria-label="Primary">
            <a class="mobile-nav-item" href="dashboard.html"><i class="fas fa-house" aria-hidden="true"></i><span>Home</span></a>
            <a class="mobile-nav-item" href="beneficiaries.html"><i class="fas fa-users" aria-hidden="true"></i><span>Beneficiaries</span></a>
            <a class="mobile-nav-item active" href="attendance.html"><i class="fas fa-clipboard-check" aria-hidden="true"></i><span>Attendance</span></a>
            <a class="mobile-nav-item" href="stock.html"><i class="fas fa-boxes-stacked" aria-hidden="true"></i><span>Stock</span></a>
        </nav>
    </div>

    <script src="assets/api.js"></script>
    <script src="assets/shared.js"></script>
    <script>
        initPage('Attendance', 'attendance');

        // Set default date to today
        document.getElementById('attendance-date').valueAsDate = new Date();

        // Load attendance data
        (async function loadAttendanceData() {
            try {
                const attData = await API.get('/api/attendance/today.php');
                const grid = document.getElementById('attendance-grid');
                if (attData.success && attData.data && attData.data.length > 0) {
                    grid.innerHTML = attData.data.map(b => {
                        const initial = getInitials(b.FullName || b.name || b.first_name);
                        const status = (b.Status === 'Present' || b.status === 'present') ? 'present' : '';
                        const statusLabel = status ? 'Present' : 'Tap to mark';
                        return `
                            <div class="beneficiary-tile ${status}" data-id="${b.BeneficiaryID || b.id}">
                                <div class="tile-avatar">${initial}</div>
                                <div class="tile-name">${b.FullName || b.name || ''}</div>
                                <div class="tile-status">${statusLabel}</div>
                            </div>
                        `;
                    }).join('');

                    // Add click handlers for tiles
                    grid.querySelectorAll('.beneficiary-tile').forEach(function(tile) {
                        tile.addEventListener('click', function() {
                            const isPresent = this.classList.contains('present');
                            this.classList.toggle('present', !isPresent);
                            this.classList.toggle('absent', isPresent);
                            const st = this.querySelector('.tile-status');
                            if (!isPresent) {
                                st.textContent = 'Present';
                                st.style.color = '#5DCAA5';
                            } else {
                                st.textContent = 'Absent';
                                st.style.color = '#fca5a5';
                            }
                        });
                    });
                }
            } catch (e) {
                // Fallback tiles not needed - placeholder shown
            }

            try {
                // Load attendance history
                const histData = await API.get('/api/attendance/history.php');
                const histBody = document.getElementById('attendance-history-body');
                if (histData.success && histData.data && histData.data.length > 0) {
                    histBody.innerHTML = histData.data.map(h => {
                        const pctClass = h.rate > 90 ? 'badge-green' : h.rate > 75 ? 'badge-amber' : 'badge-red';
                        return `
                            <tr>
                                <td>${h.Date || h.date}</td>
                                <td>${h.Registered || h.registered}</td>
                                <td>${h.Present || h.present}</td>
                                <td><span class="badge ${pctClass}">${h.rate || h.percentage}%</span></td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (e) {
                // Keep as loading
            }

            // Save attendance button
            document.getElementById('save-attendance-btn').addEventListener('click', async function() {
                const tiles = document.querySelectorAll('#attendance-grid .beneficiary-tile');
                const attendance = [];
                tiles.forEach(tile => {
                    attendance.push({
                        id: tile.dataset.id,
                        status: tile.classList.contains('present') ? 'present' : 'absent'
                    });
                });

                try {
                    const result = await API.post('/api/attendance/save.php', {
                        date: document.getElementById('attendance-date').value,
                        attendance: attendance
                    });
                    if (result.success) {
                        alert('Attendance saved successfully!');
                    }
                } catch (err) {
                    alert('Failed to save: ' + err.message);
                }
            });
        })();
    </script>
</body>
</html>
