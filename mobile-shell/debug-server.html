<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Debug - FSMS</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #065f46; }
        .error { background: #7f1d1d; }
        .info { background: #1e3a8a; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>FSMS Server Connection Debug</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addResult(title, status, message, data = null) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <strong>${title}</strong><br>
                ${message}
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
            results.appendChild(div);
        }

        async function testEndpoint(url, name) {
            try {
                const response = await fetch(url, { mode: 'cors' });
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { raw: text.substring(0, 200) };
                }
                
                if (response.ok) {
                    addResult(name, 'success', `✓ HTTP ${response.status}`, data);
                } else {
                    addResult(name, 'error', `✗ HTTP ${response.status}`, data);
                }
            } catch (error) {
                addResult(name, 'error', `✗ ${error.message}`);
            }
        }

        async function runTests() {
            const baseURL = prompt('Enter server URL:', 'http://10.0.2.2:8000');
            if (!baseURL) return;

            addResult('Configuration', 'info', `Testing: ${baseURL}`);

            await testEndpoint(baseURL + '/api/system/health.php', 'Health Check');
            await testEndpoint(baseURL + '/api/auth/login.php', 'Login Endpoint (GET)');
            
            // Test actual login
            try {
                const response = await fetch(baseURL + '/api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'admin123' })
                });
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { raw: text.substring(0, 300) };
                }
                
                if (response.ok && data.success) {
                    addResult('Login Test', 'success', '✓ Login successful', data);
                } else {
                    addResult('Login Test', 'error', `✗ Login failed (HTTP ${response.status})`, data);
                }
            } catch (error) {
                addResult('Login Test', 'error', `✗ ${error.message}`);
            }
        }

        runTests();
    </script>
</body>
</html>
